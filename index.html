/* ===== BSTF CUSTOM OVERRIDES ===== */

/* T1: Fix nav z-index above all sections */
nav.fixed { z-index: 200 !important; }

/* Header: taller, content right-aligned (logo left, links+CTA cluster on right) */
nav.fixed > div {
  min-height: 84px;
  display: flex !important;
  align-items: center !important;
  justify-content: flex-start !important;
  padding-top: 0 !important;
  padding-bottom: 0 !important;
}

/* Logo: auto margin pushes all other nav items to the right */
nav.fixed > div > :first-child { margin-right: auto; flex-shrink: 0; }

/* Desktop nav link text: slightly larger */
nav.fixed > div > div a {
  font-size: 0.9375rem !important;
  letter-spacing: 0.13em !important;
}

@media (max-width: 768px) {
  nav.fixed > div { min-height: 66px; }
}

/* T7: Prevent horizontal scrollbar from 100vw sections */
body { overflow-x: hidden; }

/* T7: Smooth scroll + anchor offset */
html { scroll-behavior: smooth; scroll-padding-top: 84px; }
#program, #speakers, #tickets, #venue, #expo { scroll-margin-top: 84px; }

/* T4: ICT Cluster info */
.ict-cluster-info {
  font-family:'IBM Plex Mono',monospace;
  font-size:.72rem; text-transform:uppercase;
  letter-spacing:.12em; color:rgba(255,255,255,.45); margin-top:.6rem;
}

/* T2: Back to Top button */
#bstf-btt {
  position:fixed; bottom:5rem; right:1.5rem; z-index:150;
  width:48px; height:48px; border-radius:50%;
  background:rgba(10,10,10,.9); border:1px solid rgba(255,255,255,.2);
  color:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center;
  opacity:0; pointer-events:none; transition:opacity .3s,background .2s;
}
#bstf-btt.on { opacity:1; pointer-events:auto; }
#bstf-btt:hover { background:rgba(255,255,255,.12); }
@media(min-width:768px){ #bstf-btt { bottom:1.5rem; } }

/* T5: Mobile sticky CTA */
#bstf-mob-cta {
  position:fixed; bottom:0; left:0; right:0; z-index:140;
  padding:.75rem 1rem; background:rgba(5,5,5,.97);
  border-top:1px solid rgba(255,255,255,.1);
  transition:transform .3s; display:block;
}
#bstf-mob-cta.hide { transform:translateY(100%); }
#bstf-mob-cta button {
  width:100%; background:#00e5ff; color:#000; border:none; border-radius:4px;
  padding:.875rem; font-family:'IBM Plex Mono',monospace; font-size:.875rem;
  font-weight:600; text-transform:uppercase; letter-spacing:.1em; cursor:pointer;
  transition:background .2s;
}
#bstf-mob-cta button:hover { background:#33eaff; }
@media(min-width:768px){ #bstf-mob-cta { display:none !important; } }

/* T9: Language switcher */
#bstf-lang {
  background:transparent; border:1px solid rgba(255,255,255,.3);
  color:#fff; font-family:system-ui,sans-serif; font-size:.78rem;
  padding:.28rem .55rem; border-radius:4px; cursor:pointer; transition:all .2s;
  flex-shrink:0; white-space:nowrap; letter-spacing:.03em;
}
#bstf-lang:hover { background:rgba(255,255,255,.1); border-color:rgba(255,255,255,.6); }

/* T7-fix: Stop GSAP scrub from hiding section content on scroll-back */
.section-pinned * {
  opacity: 1 !important;
  transform: none !important;
}
/* But allow background scale/parallax via section-bg (they don't affect readability) */
.section-pinned [class*="section-bg"],
.section-pinned [class*="hero-bg"],
.section-pinned [class*="bg-cover"] { transform: unset !important; }

/* Smooth scroll reveal animations - higher specificity to override GSAP */
body .reveal-element,
.reveal-element {
  opacity: 0 !important;
  transform: translateY(30px) !important;
  transition: opacity 0.6s ease-out, transform 0.6s ease-out;
  will-change: opacity, transform;
}
body .reveal-element.revealed,
.reveal-element.revealed {
  opacity: 1 !important;
  transform: translateY(0) !important;
}

/* Stagger animation delays */
.reveal-delay-1 { transition-delay: 0.1s; }
.reveal-delay-2 { transition-delay: 0.2s; }
.reveal-delay-3 { transition-delay: 0.3s; }
.reveal-delay-4 { transition-delay: 0.4s; }
.reveal-delay-5 { transition-delay: 0.5s; }

/* Scale reveal effect - higher specificity */
body .reveal-scale,
.reveal-scale {
  opacity: 0 !important;
  transform: scale(0.9) !important;
  transition: opacity 0.5s ease-out, transform 0.5s ease-out;
  will-change: opacity, transform;
}
body .reveal-scale.revealed,
.reveal-scale.revealed {
  opacity: 1 !important;
  transform: scale(1) !important;
}

/* Fade in from left/right - higher specificity */
body .reveal-left,
.reveal-left {
  opacity: 0 !important;
  transform: translateX(-40px) !important;
  transition: opacity 0.6s ease-out, transform 0.6s ease-out;
  will-change: opacity, transform;
}
body .reveal-left.revealed,
.reveal-left.revealed {
  opacity: 1 !important;
  transform: translateX(0) !important;
}

body .reveal-right,
.reveal-right {
  opacity: 0 !important;
  transform: translateX(40px) !important;
  transition: opacity 0.6s ease-out, transform 0.6s ease-out;
  will-change: opacity, transform;
}
body .reveal-right.revealed,
.reveal-right.revealed {
  opacity: 1 !important;
  transform: translateX(0) !important;
}

/* Smooth section transitions */
section {
  transition: opacity 0.3s ease;
}

/* Parallax background effect */
.parallax-bg {
  transition: transform 0.1s linear;
  will-change: transform;
}

/* Navigation scroll effect */
nav.fixed {
  transition: background-color 0.3s ease, backdrop-filter 0.3s ease;
}
nav.scrolled {
  background-color: rgba(0, 0, 0, 0.9) !important;
  backdrop-filter: blur(10px);
}

/* Smooth hover transitions */
a, button {
  transition: color 0.2s ease, background-color 0.2s ease, transform 0.2s ease;
}

/* Card hover effects */
[class*="card"] {
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}
[class*="card"]:hover {
  transform: translateY(-5px);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
}

/* Image zoom on hover */
img {
  transition: transform 0.4s ease;
}
[class*="hover-zoom"]:hover img,
[class*="card"]:hover img {
  transform: scale(1.05);
}

/* Button pulse animation */
@keyframes pulse {
  0% { box-shadow: 0 0 0 0 rgba(0, 229, 255, 0.4); }
  70% { box-shadow: 0 0 0 10px rgba(0, 229, 255, 0); }
  100% { box-shadow: 0 0 0 0 rgba(0, 229, 255, 0); }
}
.cta-button, [class*="cta"] {
  animation: pulse 2s infinite;
}

/* Text reveal line by line */
@keyframes textReveal {
  0% { 
    opacity: 0;
    transform: translateY(20px);
    filter: blur(10px);
  }
  100% { 
    opacity: 1;
    transform: translateY(0);
    filter: blur(0);
  }
}
.text-reveal {
  animation: textReveal 0.8s ease-out forwards;
}

/* Gradient text animation */
@keyframes gradientShift {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}
.gradient-text {
  background: linear-gradient(90deg, #00e5ff, #fff, #00e5ff);
  background-size: 200% auto;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: gradientShift 3s ease infinite;
}

/* Floating animation */
@keyframes float {
  0%, 100% { transform: translateY(0px); }
  50% { transform: translateY(-10px); }
}
.float-animation {
  animation: float 3s ease-in-out infinite;
}

/* Scroll progress indicator */
.scroll-progress {
  position: fixed;
  top: 0;
  left: 0;
  height: 3px;
  background: linear-gradient(90deg, #00e5ff, #00ffff);
  z-index: 9999;
  transition: width 0.1s linear;
}

/* T8: Ticket card selection */
.bstf-card-wrap { transition:opacity .25s; }
/* Active card: bright cyan border + outline */
.bstf-card-wrap.active {
  opacity:1 !important;
  outline: 2px solid #00e5ff !important;
  outline-offset: -1px;
  box-shadow: 0 0 16px rgba(0,229,255,.18) !important;
}
/* Inactive card: slightly dimmed, but CTA stays readable */
.bstf-card-wrap.inactive {
  opacity:.72;
  --tw-ring-shadow: 0 0 transparent !important;
  box-shadow: none !important;
  border-color: rgba(255,255,255,0.1) !important;
}
/* Active card CTA: filled cyan — clear call to action */
.bstf-card-wrap.active [data-bstf-cta] {
  background:#00e5ff !important; color:#000 !important;
  border-color:#00e5ff !important; opacity:1 !important;
  font-weight:700 !important;
}
/* Inactive card CTA: visible outline button — not the selected one, but still usable */
.bstf-card-wrap.inactive [data-bstf-cta] {
  background:rgba(255,255,255,.06) !important;
  color:rgba(255,255,255,.75) !important;
  border-color:rgba(255,255,255,.3) !important;
  opacity:1 !important;
}
.bstf-selected-badge {
  position:absolute; top:.75rem; right:.75rem;
  background:rgba(0,229,255,.15); border:1px solid rgba(0,229,255,.4);
  color:#00e5ff; font-family:'IBM Plex Mono',monospace;
  font-size:.65rem; font-weight:600; text-transform:uppercase; letter-spacing:.08em;
  padding:.2rem .45rem; border-radius:3px; opacity:0; transition:opacity .2s;
  pointer-events:none;
}
.bstf-card-wrap.active .bstf-selected-badge { opacity:1 !important; }

/* Registration modal */
#bstf-overlay {
  position:fixed; inset:0; z-index:300;
  background:rgba(0,0,0,.85); backdrop-filter:blur(8px);
  display:flex; align-items:center; justify-content:center;
  opacity:0; pointer-events:none; transition:opacity .3s; padding:1rem;
}
#bstf-overlay.open { opacity:1; pointer-events:auto; }
#bstf-modal {
  background:#080808; border:1px solid rgba(255,255,255,.12);
  border-radius:8px; padding:2rem; width:100%;
  max-width:480px; max-height:90vh; overflow-y:auto; position:relative;
}
#bstf-modal h2 {
  font-family:'Space Grotesk',sans-serif; font-size:1.4rem; font-weight:700;
  color:#fff; margin:0 0 .25rem;
}
#bstf-modal .msub {
  font-family:'IBM Plex Mono',monospace; font-size:.7rem; text-transform:uppercase;
  letter-spacing:.1em; color:rgba(255,255,255,.45); margin-bottom:1.5rem;
}
#bstf-modal .fg { margin-bottom:.9rem; }
#bstf-modal label {
  display:block; font-family:'IBM Plex Mono',monospace; font-size:.68rem;
  text-transform:uppercase; letter-spacing:.08em; color:rgba(255,255,255,.5); margin-bottom:.35rem;
}
#bstf-modal input, #bstf-modal select {
  width:100%; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.15);
  border-radius:4px; padding:.6rem .85rem; color:#fff;
  font-family:'Inter',sans-serif; font-size:.875rem; outline:none;
  transition:border-color .2s; box-sizing:border-box;
}
#bstf-modal input:focus, #bstf-modal select:focus { border-color:rgba(0,229,255,.6); }
#bstf-modal select option { background:#080808; color:#fff; }
#bstf-modal .frow { display:grid; grid-template-columns:1fr 1fr; gap:.75rem; }
#bstf-modal .msub-btn {
  width:100%; background:#00e5ff; color:#000; border:none; border-radius:4px;
  padding:.875rem; font-family:'IBM Plex Mono',monospace; font-size:.875rem;
  font-weight:600; text-transform:uppercase; letter-spacing:.1em;
  cursor:pointer; transition:background .2s; margin-top:.5rem;
}
#bstf-modal .msub-btn:hover { background:#33eaff; }
#bstf-modal .mclose {
  position:absolute; top:1rem; right:1rem;
  background:transparent; border:none; color:rgba(255,255,255,.5);
  cursor:pointer; font-size:1.25rem; line-height:1; padding:.25rem; transition:color .2s;
}
#bstf-modal .mclose:hover { color:#fff; }
#bstf-modal .msuccess { text-align:center; padding:2rem 1rem; display:none; }
#bstf-modal .msuccess.show { display:block; }
#bstf-modal .msuccess h3 {
  font-family:'Space Grotesk',sans-serif; font-size:1.3rem;
  font-weight:700; color:#00e5ff; margin-bottom:.75rem;
}
#bstf-modal .msuccess p {
  font-family:'Inter',sans-serif; font-size:.875rem;
  color:rgba(255,255,255,.6); line-height:1.6;
}
#bstf-form-inner { display:block; }

/* Increase base font size for readability */
body {
  font-size: 1.0625rem;
}

/* Slightly smaller text for labels and secondary info */
.text-xs, .text-sm, label {
  font-size: 0.9375rem;
}

    <!-- Landing Page Loader -->
    <div id="bstf-landing" style="position: fixed; inset: 0; z-index: 9999; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.6s ease, visibility 0.6s ease;">
      <div style="text-align: center; padding: 2rem;">
        <h1 style="font-family: 'Space Grotesk', sans-serif; font-size: 3rem; font-weight: 700; color: #fff; margin-bottom: 0.5rem; letter-spacing: -0.02em;"><span style="color: #22d3ee;">BSTF</span>2026</h1>
      </div>
    </div>
    <style>
      #bstf-landing.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
    </style>
    <script>
      (function() {
        // Hide landing page after page loads and translations are applied
        function hideLanding() {
          var landing = document.getElementById('bstf-landing');
          if (landing) {
            landing.classList.add('hidden');
            setTimeout(function() {
              landing.style.display = 'none';
            }, 600);
          }
        }
        
        // Hide after 2.5 seconds (enough for React and translations to load)
        setTimeout(hideLanding, 2500);
        
        // Also hide on window load as backup
        window.addEventListener('load', function() {
          setTimeout(hideLanding, 1000);
        });
      })();

<!-- ===== BSTF Modal ===== -->
<div id="bstf-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div id="bstf-modal">
    <button class="mclose" aria-label="Затвори">&times;</button>
    <div id="bstf-form-inner">
      <h2 id="modal-title">Register for BSTF 2026</h2>
      <p class="msub" id="modal-sub">Black Sea Technology Forum &bull; 24&ndash;26 септември 2026 &bull; Варна</p>
      <div class="frow">
        <div class="fg">
          <label for="bstf-fname" id="lbl-fname">First Name *</label>
          <input type="text" id="bstf-fname" required autocomplete="given-name">
        </div>
        <div class="fg">
          <label for="bstf-lname" id="lbl-lname">Last Name *</label>
          <input type="text" id="bstf-lname" required autocomplete="family-name">
        </div>
      </div>
      <div class="fg">
        <label for="bstf-email" id="lbl-email">Email *</label>
        <input type="email" id="bstf-email" required autocomplete="email">
      </div>
      <div class="fg">
        <label for="bstf-phone" id="lbl-phone">Phone</label>
        <input type="tel" id="bstf-phone" autocomplete="tel">
      </div>
      <div class="fg">
        <label for="bstf-ticket" id="lbl-ticket">Ticket Type</label>
        <select id="bstf-ticket">
          <option value="early-bird" data-en="Early Bird" data-bg="Ранен билет">Early Bird</option>
          <option value="standard" data-en="Standard" data-bg="Стандартен">Standard</option>
          <option value="vip" data-en="VIP / All Access" data-bg="VIP / Пълен достъп">VIP / All Access</option>
        </select>
      </div>
      <button class="msub-btn" id="bstf-submit">Register now</button>
    </div>
    <div class="msuccess" id="bstf-success">
      <h3 id="success-title">Thank you!</h3>
      <p id="success-msg">We received your registration.<br>We will contact you shortly at the provided email address.</p>
    </div>
  </div>
</div>

</button>

  // ─── Modal ────────────────────────────────────────────────
  var overlay = document.getElementById('bstf-overlay');
  var formInner = document.getElementById('bstf-form-inner');
  var successDiv = document.getElementById('bstf-success');
  var ticketSel = document.getElementById('bstf-ticket');

  function updateModalLang(){
    if(!ticketSel) return;
    Array.from(ticketSel.options).forEach(function(opt){
      var txt = opt.getAttribute('data-' + lang);
      if(txt) opt.textContent = txt;
    });
  }

  function openModal(ticketType) {
    ticketType = ticketType || selectedTicket;
    updateModalLang();
    if(ticketSel) ticketSel.value = ticketType;
    formInner.style.display = 'block';
    successDiv.classList.remove('show');
    overlay.classList.add('open');
    document.body.style.overflow = 'hidden';
    setTimeout(function(){ var f = document.getElementById('bstf-fname'); if(f) f.focus(); }, 120);
  }

  function closeModal() {
    overlay.classList.remove('open');
    document.body.style.overflow = '';
  }

  overlay.addEventListener('click', function(e){ if(e.target === overlay) closeModal(); });
  document.querySelector('#bstf-modal .mclose').addEventListener('click', function(e){ e.stopPropagation(); closeModal(); });
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape') closeModal(); });

  document.getElementById('bstf-submit').addEventListener('click', function(){
    var fname = (document.getElementById('bstf-fname').value || '').trim();
    var email = (document.getElementById('bstf-email').value || '').trim();
    if(!fname){ document.getElementById('bstf-fname').focus(); return; }
    if(!email || !email.includes('@')){ document.getElementById('bstf-email').focus(); return; }
    formInner.style.display = 'none';
    successDiv.classList.add('show');

  // ─── Translation engine ───────────────────────────────────
  var origMap = new WeakMap();
  function applyTranslations(){
    document.documentElement.lang = lang;
    var isBG = lang === 'bg';
    var dict = isBG ? BG : {};

    var walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, {
      acceptNode: function(node){
        var p = node.parentElement;
        if(!p) return NodeFilter.FILTER_REJECT;
        var tag = p.tagName;
        if(tag==='SCRIPT'||tag==='STYLE'||tag==='NOSCRIPT') return NodeFilter.FILTER_REJECT;
        // Skip entire modal — it has its own translation logic
        if(p.closest && p.closest('#bstf-overlay')) return NodeFilter.FILTER_REJECT;
        if(p.id && p.id.startsWith('bstf-') && p.id!=='bstf-mob-btn') return NodeFilter.FILTER_SKIP;
        var txt = node.textContent.trim();
        if(!txt) return NodeFilter.FILTER_SKIP;
        return NodeFilter.FILTER_ACCEPT;
      }
    });

    var nodes = [];
    var n;
    while((n = walker.nextNode())) nodes.push(n);

    nodes.forEach(function(node){
      // Store original English text only on first encounter
      if(!origMap.has(node)){
        var currentText = node.textContent;
        // Only store if it's English (contains Latin characters)
        if(/[a-zA-Z]/.test(currentText)){
          origMap.set(node, currentText);
        }
      }
      var orig = origMap.get(node) || node.textContent;
      var current = node.textContent;
      var trimmed = current.trim();
      
      if(!isBG){
        // Restore original English
        if(origMap.has(node)){
          node.textContent = origMap.get(node);
        }
        return;
      }
      
      // Try exact match on current text first
      // Preserve leading/trailing whitespace so " into" → " в" (not "в")
      if(dict[trimmed] !== undefined){
        var lead = current.match(/^\s+/);
        var trail = current.match(/\s+$/);
        node.textContent = (lead ? lead[0] : '') + dict[trimmed] + (trail ? trail[0] : '');
        return;
      }
      // Try normalized match (remove extra whitespace)
      var normalized = trimmed.replace(/\s+/g, ' ');
      if(dict[normalized] !== undefined){
        var lead2 = current.match(/^\s+/);
        var trail2 = current.match(/\s+$/);
        node.textContent = (lead2 ? lead2[0] : '') + dict[normalized] + (trail2 ? trail2[0] : '');
        return;
      }
      // Partial replacement for longer phrases - work on current text
      var t = current;
      // Sort keys by length (longest first) to ensure longer phrases are replaced before shorter ones
      var sortedKeys = Object.keys(dict).sort(function(a, b){ return b.length - a.length; });
      sortedKeys.forEach(function(k){
        if(k.length > 2){
          // Try exact match
          if(t.indexOf(k) !== -1) t = t.split(k).join(dict[k]);
          // Try with normalized whitespace
          var kNormalized = k.replace(/\s+/g, ' ');
          if(kNormalized !== k && t.indexOf(kNormalized) !== -1){
            t = t.split(kNormalized).join(dict[k]);
          }
        }
      });
      node.textContent = t;
    });

    // Modal static texts
    var mm = {
      'modal-title': isBG ? 'Регистрация за BSTF 2026' : 'Register for BSTF 2026',
      'lbl-fname': isBG ? 'Собствено име *' : 'First Name *',
      'lbl-lname': isBG ? 'Фамилно име *' : 'Last Name *',
      'lbl-email': isBG ? 'Имейл *' : 'Email *',
      'lbl-phone': isBG ? 'Телефон' : 'Phone',
      'lbl-ticket': isBG ? 'Тип билет' : 'Ticket Type',
      'bstf-submit': isBG ? 'Регистрирай се' : 'Register now',
      'success-title': isBG ? 'Благодарим!' : 'Thank you!',
      'bstf-mob-btn': isBG ? 'Регистрирай се' : 'Register now'
    };
    Object.keys(mm).forEach(function(id){
      var el = document.getElementById(id);
      if(el) el.textContent = mm[id];
    });
    // updateModalLang() is called only from openModal() and language switcher click
    // NOT here, to avoid interfering with native <select> popup
    var smsg = document.getElementById('success-msg');
    if(smsg) smsg.innerHTML = isBG
      ? 'Получихме вашата регистрация.<br>Ще се свържем с вас скоро на предоставения имейл адрес.'
      : 'We received your registration.<br>We will contact you shortly.';

    document.querySelectorAll('.bstf-selected-badge').forEach(function(b){
      b.textContent = isBG ? 'Избрано' : 'Selected';
    });
    var ict = document.querySelector('.ict-cluster-info');
    if(ict) ict.textContent = isBG ? 'Организирано от ИКТ Клъстер — Варна' : 'Organized by ICT Cluster — Varna';
    var lb = document.getElementById('bstf-lang');
    if(lb){ lb.textContent = isBG ? 'EN' : 'BG'; lb.title = isBG ? 'Switch to English' : 'Превключи на Български'; }

    // Fix GSAP word-span headings (hero h1 & ThreeDayArc h2)
    fixWordSpanH1(isBG);
    fixWordSpanThreeDayH2(isBG);
  }

  // ─── GSAP word-span heading fixers ────────────────────────

  // ─── Smooth scroll reveal animations ─────────────────────
  function initScrollAnimations(){
    // Add reveal classes to elements
    var sections = document.querySelectorAll('section');
    var allRevealElements = [];
    
    sections.forEach(function(section, idx){
      var headings = section.querySelectorAll('h1, h2, h3');
      var paragraphs = section.querySelectorAll('p');
      var cards = section.querySelectorAll('.card, [class*="card"]');
      var lists = section.querySelectorAll('ul, ol');
      
      headings.forEach(function(el, i){
        el.classList.add('reveal-element');
        if(i % 3 === 0) el.classList.add('reveal-delay-1');
        else if(i % 3 === 1) el.classList.add('reveal-delay-2');
        else el.classList.add('reveal-delay-3');
        allRevealElements.push(el);
      });
      
      paragraphs.forEach(function(el, i){
        el.classList.add('reveal-element');
        if(i % 4 === 0) el.classList.add('reveal-delay-2');
        else if(i % 4 === 1) el.classList.add('reveal-delay-3');
        else if(i % 4 === 2) el.classList.add('reveal-delay-4');
        else el.classList.add('reveal-delay-5');
        allRevealElements.push(el);
      });
      
      cards.forEach(function(el, i){
        el.classList.add('reveal-scale');
        if(i % 3 === 0) el.classList.add('reveal-delay-1');
        else if(i % 3 === 1) el.classList.add('reveal-delay-2');
        else el.classList.add('reveal-delay-3');
        allRevealElements.push(el);
      });
      
      lists.forEach(function(el){
        el.classList.add('reveal-element');
        el.classList.add('reveal-delay-3');
        allRevealElements.push(el);
      });
    });
    
    // Immediately reveal elements that are already in viewport
    var windowHeight = window.innerHeight;
    allRevealElements.forEach(function(el){
      var rect = el.getBoundingClientRect();
      if(rect.top < windowHeight && rect.bottom > 0){
        // Element is visible, add revealed class with small stagger based on position
        var delay = Math.max(0, rect.top / windowHeight) * 500;
        setTimeout(function(){
          el.classList.add('revealed');
        }, delay);
      }
    });
    
    // Intersection Observer for reveal animations on scroll
    var revealObserver = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if(entry.isIntersecting){
          entry.target.classList.add('revealed');
        }
      });
    }, {
      threshold: 0.05,
      rootMargin: '50px 0px -30px 0px'
    });
    
    // Observe all reveal elements
    document.querySelectorAll('.reveal-element, .reveal-scale, .reveal-left, .reveal-right').forEach(function(el){
      revealObserver.observe(el);
    });
  }

  // ─── Smooth scroll with easing for anchor links ───────────
  document.querySelectorAll('a[href^="#"]').forEach(function(anchor){
    anchor.addEventListener('click', function(e){
      var targetId = this.getAttribute('href');
      if(targetId === '#') return;
      
      var targetElement = document.querySelector(targetId);
      if(targetElement){
        e.preventDefault();
        var targetPosition = targetElement.getBoundingClientRect().top + window.scrollY;
        var startPosition = window.scrollY;
        var distance = targetPosition - startPosition;
        var duration = 1000;
        var startTime = null;
        
        function animation(currentTime){
          if(startTime === null) startTime = currentTime;
          var timeElapsed = currentTime - startTime;
          var progress = Math.min(timeElapsed / duration, 1);
          
          // Ease in-out cubic
          var ease = progress < 0.5 
            ? 4 * progress * progress * progress 
            : 1 - Math.pow(-2 * progress + 2, 3) / 2;
          
          window.scrollTo(0, startPosition + distance * ease);
          
          if(timeElapsed < duration){
            requestAnimationFrame(animation);
          }
        }
        
        requestAnimationFrame(animation);
      }
    });
  });

})();
</script>

<!-- Program section: remove inner scroll, use normal page scroll -->
<style id="bstf-program-css">
/* Allow section to grow beyond 100vh */
#program {
  overflow: visible !important;
  height: auto !important;
}
/* Content wrapper: take out of absolute, flow normally */
#program > div[class*="flex-col"] {
  position: relative !important;
  inset: unset !important;
  width: 100% !important;
  min-height: 100vh !important;
}
/* Remove the inner scroll container */
#program [class~="flex-1"] {
  flex: none !important;
  overflow: visible !important;
  height: auto !important;
}
#program [class~="overflow-y-auto"] {
  height: auto !important;
  max-height: none !important;
  overflow: visible !important;
}
/* Sticky table header now sticks to viewport top (nav = ~72px) */
#program [class~="sticky"] {
  top: 72px !important;
  backdrop-filter: blur(10px) !important;
  -webkit-backdrop-filter: blur(10px) !important;
}
</style>
<script id="bstf-program-fix">
(function(){
  function getST(){
    if(window.ScrollTrigger && window.ScrollTrigger.getAll) return window.ScrollTrigger;
    if(window.gsap){
      if(typeof window.gsap.getPlugin === 'function'){
        try { var p = window.gsap.getPlugin('ScrollTrigger'); if(p && p.getAll) return p; } catch(e){}
      }
      if(window.gsap.plugins && window.gsap.plugins.scrollTrigger){
        var sp = window.gsap.plugins.scrollTrigger;
        if(sp.getAll) return sp;
      }
    }
    return null;
  }

  function fixProgram(){
    var sec = document.getElementById('program');
    if(!sec) return;

    // Kill GSAP ScrollTrigger scrub (end:"+=140%", scrub:.7) — no longer needed
    try {
      var ST = getST();
      if(ST){
        (ST.getAll() || []).forEach(function(t){
          try {
            var trig = t.vars && t.vars.trigger;
            if(trig && (trig === sec || sec.contains(trig))){ t.kill(); }
          } catch(e){}
        });
      }
    } catch(e){}

    // Also clear via globalTimeline if above didn't catch it
    try {
      if(window.gsap && window.gsap.globalTimeline){
        window.gsap.globalTimeline.getChildren(true, false, true).forEach(function(tl){
          try {
            var st = tl.scrollTrigger;
            if(st){
              var trig = st.vars && st.vars.trigger;
              if(trig && (trig === sec || sec.contains(trig))){ st.kill(); tl.kill(); }
            }
          } catch(e){}
        });
      }
    } catch(e){}

    // Clear any GSAP inline opacity/transform on children (so they show without animating in)
    try {
      if(window.gsap) window.gsap.set('#program *', {clearProps: 'opacity,transform,y,scaleX'});
    } catch(e){}
  }

  setTimeout(fixProgram, 1200);
})();
</script>
