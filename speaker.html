  <!--
    Legacy hash-based speaker URL (speaker.html#slug). Each speaker now has a real
    page at speakers/{slug}/ -- this file only bridges old bookmarks/shared links
    to the new address. See speakers/{slug}/index.html for the actual content.
  -->
  <script>
    (function () {
      var rawHash = window.location.hash.replace(/^#/, '');
      var id;
      try { id = decodeURIComponent(rawHash); } catch (e) { id = rawHash; }
      if (!id) {
        var params = new URLSearchParams(window.location.search);
        id = params.get('id');
      }
      if (id) {
        window.location.replace('speakers/' + encodeURIComponent(id) + '/');
      } else {
        window.location.replace('speakers.html');
      }
    })();
  </script>
