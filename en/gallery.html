  <style>
    :root {
      --navy: #0B3954;
      --navy-deep: #0d4a6e;
      --teal: #00cdff;
      --teal-contrast: #006d8f;
      --teal-deep: #00a0cc;
      --light-blue: #EDF7FA;
      --white: #FFFFFF;
      --light-gray: #F5F7F9;
      --dark: #1a1a2e;
      --text: #333;
      --text-light: #666;
      --radius: 12px;
      --radius-sm: 8px;
      --transition: 0.3s ease;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      --shadow-lg: 0 8px 40px rgba(0, 0, 0, 0.12);
      --radius-lg: 20px;
      --shadow-modal: inset 0 1px 0 rgba(255, 255, 255, 0.7), 0 8px 20px rgba(11, 57, 84, 0.12), 0 30px 64px rgba(11, 57, 84, 0.2);
      --ease-premium: cubic-bezier(0.16, 1, 0.3, 1);
      --dot-grid: radial-gradient(circle at 1px 1px, rgba(255, 255, 255, 0.07) 1px, transparent 0);
      --mono: 'Science Gothic', 'SFMono-Regular', Consolas, monospace
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 84px
    }

    body {
      font-family: 'Science Gothic', sans-serif;
      color: var(--text);
      line-height: 1.6;
      overflow-x: hidden;
      background: var(--white)
    }

    ::selection {
      background: var(--teal);
      color: var(--white)
    }

    ::-webkit-scrollbar {
      width: 11px
    }

    ::-webkit-scrollbar-track {
      background: var(--light-gray)
    }

    ::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, var(--teal), var(--navy));
      border-radius: 20px;
      border: 3px solid var(--light-gray)
    }

    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
      font-family: 'Science Gothic', sans-serif;
      font-weight: 600;
      line-height: 1.2
    }

    a {
      text-decoration: none;
      color: inherit
    }

    img {
      max-width: 100%;
      display: block
    }

    button {
      cursor: pointer;
      font-family: inherit;
      border: none;
      background: none
    }

    ul {
      list-style: none
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 11px 24px;
      border-radius: var(--radius);
      font-weight: 600;
      font-size: 0.9rem;
      letter-spacing: 0.01em;
      transition: transform 0.3s var(--ease-premium), box-shadow 0.3s var(--ease-premium), background 0.3s ease;
      cursor: pointer;
      position: relative
    }

    .btn-primary {
      background: linear-gradient(155deg, var(--teal) 0%, var(--teal-deep) 100%);
      color: var(--white);
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.25) inset, 0 8px 20px rgba(0, 160, 204, 0.28)
    }

    .btn-primary:hover {
      background: linear-gradient(155deg, #33d6ff 0%, var(--teal-deep) 100%);
      transform: translateY(-2px);
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.3) inset, 0 14px 30px rgba(0, 160, 204, 0.38)
    }

    .btn-outline {
      border: 2px solid var(--teal-contrast);
      color: var(--teal-contrast);
      background: rgba(0, 205, 255, 0.03)
    }

    .btn-outline:hover {
      background: var(--teal);
      color: var(--white);
      box-shadow: 0 10px 24px rgba(0, 160, 204, 0.28);
      transform: translateY(-2px)
    }

    .btn:active {
      transform: scale(0.97);
      opacity: 0.85;
      transition: transform 150ms ease-out, opacity 150ms ease-out
    }

    .btn-white {
      background: linear-gradient(155deg, var(--white) 0%, #f4fafb 100%);
      color: var(--navy);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12)
    }

    .btn-white:hover {
      background: var(--light-blue);
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.16)
    }

    .btn-sm {
      padding: 10px 20px;
      font-size: 0.875rem
    }

    nav.main-nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 200;
      background: rgba(255, 255, 255, 0.97);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(0, 0, 0, 0.06);
      transition: var(--transition)
    }

    nav.main-nav .nav-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 72px;
      width: 100%;
      padding: 0 32px
    }

    nav.main-nav .logo {
      font-family: 'Science Gothic', sans-serif;
      font-size: 1.17rem;
      font-weight: 600;
      color: var(--navy)
    }

    nav.main-nav .logo span {
      color: var(--teal)
    }

    nav.main-nav .nav-register-btn {
      font-family: 'Science Gothic', sans-serif;
      font-weight: 600;}

    nav.main-nav .cx-nav-logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      line-height: 1
    }

    nav.main-nav .cx-nav-logo-img {
      height: 30px;
      width: auto;
      display: block
    }

    nav.main-nav .cx-nav-tagline {
      display: block;
      width: 194px;
      margin: 7px auto 0;
      font-size: 8px;
      font-weight: 600;
      white-space: nowrap;
      text-align: center;
      color: rgba(0, 0, 0, 0.5)
    }

    nav.main-nav .cx-nav-tagline-inner {
      display: inline-block;
      letter-spacing: 0.6em;
      margin-right: -0.6em
    }

    nav.main-nav .nav-links {
      display: flex;
      align-items: center;
      gap: 32px;
      margin-left: auto
    }

    nav.main-nav .nav-links a {
      font-size: 0.83rem;
      font-weight: 500;
      color: var(--text);
      transition: var(--transition);
      position: relative
    }

    nav.main-nav .nav-links a:hover {
      color: var(--teal)
    }

    nav.main-nav .nav-links a::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 0;
      width: 0;
      height: 2px;
      background: var(--teal);
      transition: var(--transition)
    }

    nav.main-nav .nav-links a:hover::after {
      width: 100%
    }

    nav.main-nav .nav-links a.active {
      color: var(--teal)
    }

    nav.main-nav .nav-links a.active::after {
      width: 100%
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-left: 32px
    }

    .lang-toggle {
      display: flex;
      border: 1px solid #ddd;
      border-radius: var(--radius-sm);
      overflow: hidden
    }

    .lang-toggle a {
      padding: 6px 12px;
      font-size: 0.8rem;
      font-weight: 600;
      transition: var(--transition);
      background: var(--white);
      color: var(--text)
    }

    .lang-toggle a.active {
      background: var(--navy);
      color: var(--white)
    }

    .mobile-menu-btn {
      display: none;
      flex-direction: column;
      gap: 5px;
      padding: 8px
    }

    .mobile-menu-btn span {
      width: 24px;
      height: 2px;
      background: var(--navy);
      transition: var(--transition)
    }

    .mobile-menu-btn.active span:nth-child(1) {
      transform: translateY(7px) rotate(45deg)
    }

    .mobile-menu-btn.active span:nth-child(2) {
      opacity: 0
    }

    .mobile-menu-btn.active span:nth-child(3) {
      transform: translateY(-7px) rotate(-45deg)
    }

    .mobile-nav {
      display: none;
      position: fixed;
      top: 72px;
      left: 0;
      right: 0;
      background: var(--white);
      border-bottom: 1px solid rgba(0, 0, 0, 0.06);
      padding: 24px;
      z-index: 199
    }

    .mobile-nav.open {
      display: block
    }

    .mobile-nav-backdrop {
      display: none;
      position: fixed;
      top: 72px;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.4);
      z-index: 198
    }

    .mobile-nav-backdrop.open {
      display: block
    }

    .mobile-nav a {
      display: block;
      padding: 12px 0;
      font-size: 1rem;
      font-weight: 500;
      color: var(--text);
      border-bottom: 1px solid var(--light-gray)
    }

    .mobile-nav a.btn-primary {
      color: var(--white) !important;
      border-bottom: none
    }

    .mobile-nav a.active {
      color: var(--teal)
    }

    footer.main-footer {
      position: relative;
      background: var(--dark);
      color: rgba(255, 255, 255, 0.8);
      border-top: 1px solid transparent;
      background-image: linear-gradient(var(--dark), var(--dark)), linear-gradient(90deg, transparent, rgba(0, 205, 255, 0.5), transparent);
      background-origin: border-box;
      background-clip: padding-box, border-box;
      padding: 64px 0 32px
    }

    .footer-grid {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr;
      gap: 48px;
      margin-bottom: 48px;
      text-align: center
    }

    /* The global img{display:block} reset makes this an unstyled block box
      that ignores the parent's text-align — needs its own margin:auto. */
    .footer-brand img {
      margin-left: auto;
      margin-right: auto
    }

    .footer-brand .logo {
      font-size: 1.38rem;
      font-weight: 700;
      color: var(--white);
      margin-bottom: 12px
    }

    .footer-brand .logo span {
      color: var(--teal)
    }

    .footer-brand p {
      font-size: 0.78rem;
      line-height: 1.7
    }

    .footer-col h4 {
      font-family: var(--mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--white);
      margin-bottom: 18px
    }

    .footer-col a {
      display: block;
      font-size: 0.78rem;
      padding: 4px 0;
      transition: color 0.3s ease, transform 0.3s var(--ease-premium)
    }

    .footer-col a:hover {
      color: var(--teal);
      transform: translateX(3px)
    }

    .footer-email-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 4px 0
    }

    .footer-email-row a {
      display: inline;
      padding: 0
    }

    .copy-email-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      padding: 2px;
      color: rgba(255, 255, 255, 0.5);
      cursor: pointer;
      transition: color 0.3s ease
    }

    .copy-email-btn:hover {
      color: var(--teal)
    }

    .copy-email-msg {
      font-size: 0.75rem;
      color: var(--teal)
    }

    .footer-bottom {
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 8px;
      text-align: center;
      font-size: 0.74rem
    }

    .footer-bottom span {
      text-wrap: balance
    }

    #bstf-btt {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--navy);
      color: var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      z-index: 100;
      opacity: 0;
      visibility: hidden;
      transition: var(--transition);
      box-shadow: var(--shadow)
    }

    #bstf-btt.visible {
      opacity: 1;
      visibility: visible
    }

    #bstf-btt:hover {
      background: var(--teal);
      transform: translateY(-2px)
    }

    #bstf-mob-cta {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--teal);
      padding: 12px 20px calc(20px + env(safe-area-inset-bottom, 0px));
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: translateY(100%);
      transition: transform 0.3s ease;
      box-shadow: 0 -2px 12px rgba(0, 0, 0, 0.15)
    }

    #bstf-mob-cta.visible {
      transform: translateY(0)
    }

    @media(min-width:769px) {
      #bstf-mob-cta {
        display: none !important
      }
    }

    body.page-exit {
      opacity: 0;
      transition: opacity 0.12s ease-in
    }

    @media(max-width:1024px) {
      .footer-grid {
        grid-template-columns: 1fr 1fr
      }
    }

    @media(max-width:768px) {
      .nav-links {
        display: none !important
      }

      .mobile-menu-btn {
        display: flex
      }

      nav.main-nav .nav-inner {
        padding: 0 20px
      }

      nav.main-nav .cx-nav-logo-img {
        height: 22px
      }

      nav.main-nav .cx-nav-tagline {
        width: 138px;
        margin-top: 5px;
        font-size: 6px
      }

      .nav-right {
        margin-left: 0
      }





      footer.main-footer {
        padding: 24px 0 32px
      }

      .footer-grid {
        grid-template-columns: 1fr
      }

      .footer-bottom {
        flex-direction: column;
        gap: 8px;
        text-align: center
      }

      #bstf-btt {
        bottom: 5rem
      }
    }

    @media(max-width:768px) {
      #nav-cta-btn {
        display: none !important
      }
    }
  </style>

  <!-- Back to Top -->
  <button id="bstf-btt" onclick="window.scrollTo({top:0,behavior:'smooth'})" aria-label="Back to top">&#x2191;</button>

  <script>
    (function () {
      'use strict';
      var currentLang = 'en';
      function setLang(lang) {
        currentLang = lang;
        localStorage.setItem('bstf-lang', lang);
        document.documentElement.lang = lang;
        document.title = lang === 'bg' ? '\u0421\u043d\u0438\u043c\u043a\u0438 \u043e\u0442 CONNEXUS 2026 \u2014 \u0427\u0435\u0440\u043d\u043e\u043c\u043e\u0440\u0441\u043a\u0438 \u0442\u0435\u0445\u043d\u043e\u043b\u043e\u0433\u0438\u0447\u0435\u043d \u0444\u043e\u0440\u0443\u043c' : 'CONNEXUS 2026 Photo Gallery \u2014 Black Sea Technology Forum';
        document.querySelectorAll('.lang-toggle a').forEach(function (btn) {
          btn.classList.toggle('active', btn.dataset.lang === lang);
        });
        document.querySelectorAll('[data-bg][data-en]').forEach(function (el) {
          var text = lang === 'bg' ? el.getAttribute('data-bg') : el.getAttribute('data-en');
          if (text !== null) {
            if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') { el.placeholder = text; }
            else { el.innerHTML = text; }
          }
        });
      }
      window.setLang = setLang;
      document.querySelectorAll('.lang-toggle a').forEach(function (btn) {
        btn.addEventListener('click', function (e) { if (btn.getAttribute('href') === '#') { e.preventDefault(); setLang(btn.dataset.lang); } });
      });
      setLang(currentLang);

      var menuBtn = document.querySelector('.mobile-menu-btn');
      var mobileNav = document.getElementById('mobile-nav');
      var mobileNavBackdrop = document.getElementById('mobile-nav-backdrop');
      if (menuBtn && mobileNav) {
        menuBtn.addEventListener('click', function () { var willOpen = !mobileNav.classList.contains('open'); mobileNav.classList.toggle('open', willOpen); menuBtn.classList.toggle('active', willOpen); if (mobileNavBackdrop) mobileNavBackdrop.classList.toggle('open', willOpen); document.body.style.overflow = willOpen ? 'hidden' : ''; });
        mobileNav.querySelectorAll('a').forEach(function (link) {
          link.addEventListener('click', function () { mobileNav.classList.remove('open'); menuBtn.classList.remove('active'); if (mobileNavBackdrop) mobileNavBackdrop.classList.remove('open'); document.body.style.overflow = ''; });
        });
        if (mobileNavBackdrop) {
          mobileNavBackdrop.addEventListener('click', function () { mobileNav.classList.remove('open'); menuBtn.classList.remove('active'); mobileNavBackdrop.classList.remove('open'); document.body.style.overflow = ''; });
        }
      }


      // Copy email fallback (mailto: fails silently with no mail client configured)
      document.querySelectorAll('.copy-email-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var email = btn.dataset.email;
          var msg = btn.parentElement.querySelector('.copy-email-msg');
          function reveal() {
            if (!msg) return;
            msg.hidden = false;
            clearTimeout(btn._copyTimer);
            btn._copyTimer = setTimeout(function () { msg.hidden = true; }, 1800);
          }
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(email).then(reveal, reveal);
          } else {
            var ta = document.createElement('textarea');
            ta.value = email;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            try { document.execCommand('copy'); } catch (err) {}
            document.body.removeChild(ta);
            reveal();
          }
        });
      });

      // Smooth page transitions (same-tab links only).
      document.querySelectorAll('a[href]').forEach(function (link) {
        var href = link.getAttribute('href');
        if (!href || href.startsWith('#') || href.split('#')[0] === location.pathname.split('/').pop() || href.startsWith('mailto:') || href.startsWith('tel:') || href.startsWith('javascript:') || link.target === '_blank') return;
        link.addEventListener('click', function (e) {
          if (e.ctrlKey || e.metaKey || e.shiftKey) return;
          e.preventDefault();
          var to = link.getAttribute('href');
          document.body.classList.add('page-exit');
          setTimeout(function () { window.location.href = to; }, 120);
        });
      });

      var btt = document.getElementById('bstf-btt');
      if (btt) {
        window.addEventListener('scroll', function () {
          if (window.scrollY > window.innerHeight * 1.5) { btt.classList.add('visible'); }
          else { btt.classList.remove('visible'); }
        });
      }

    })();
    window.addEventListener('pageshow', function (e) { if (e.persisted) window.location.reload(); });
  </script>
  <script src="../data/gallery-data.js?v=20261013"></script>
  <script src="../shared/gallery.js?v=20261013-2"></script>
  <script>Gallery.init({ lang: 'en' });</script>
</body>
